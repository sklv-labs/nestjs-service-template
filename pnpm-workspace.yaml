# pnpm 10+ does not run dependency build scripts unless they are listed here.
allowBuilds:
  # esbuild downloads its platform binary in a postinstall; vitest and drizzle-kit need it.
  esbuild: true
  # Telemetry only.
  '@scarf/scarf': false

# pnpm 11 holds back very recently published versions as a supply-chain measure. These are our
# own packages, published from sklv-labs/ts, so the delay adds nothing.
minimumReleaseAgeExclude:
  - '@sklv-labs/core'
  - '@sklv-labs/dev-configs'
  - '@sklv-labs/nestjs-config'
