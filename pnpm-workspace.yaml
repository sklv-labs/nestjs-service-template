# The shared runtime code is developed here as a real package, so the boundary is enforced by the
# package manager rather than by good intentions. Migrating it to sklv-labs/ts is then a directory
# move plus swapping `workspace:*` for a published range.
packages:
  - 'packages/*'

# pnpm 10+ does not run dependency build scripts unless they are listed here.
allowBuilds:
  # esbuild downloads its platform binary in a postinstall; vitest and drizzle-kit need it.
  esbuild: true
  # Telemetry only.
  '@scarf/scarf': false
  # A gRPC codegen step pulled in transitively by @usebruno/cli. Only HTTP collections are run
  # here, so the generated stubs are never used.
  protobufjs: false

# pnpm 11 holds back very recently published versions as a supply-chain measure. These are our
# own packages, published from sklv-labs/ts, so the delay adds nothing.
minimumReleaseAgeExclude:
  - '@sklv-labs/core'
  - '@sklv-labs/dev-configs'
  - '@sklv-labs/nestjs-config'
